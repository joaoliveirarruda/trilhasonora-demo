<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrilhaFlix — demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>TrilhaFlix</h1>
    <p>Demo do mini-projeto que fecha o bloco Python Básico do Trilha.
       Catálogo de 60 conteúdos rodando 100% no seu browser.</p>

  <script src="app.js"></script>
